name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the release as a DRAFT up front, so the platform jobs only ever
  # upload to it. They run in parallel and independently; the release stays
  # hidden until the publish job flips it, once both platforms have succeeded.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen is a semver pre-release (v0.1.0-rc1); mark it so
          # it never shows up as the latest release.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          # Notes come from the CHANGELOG section for this version (a pre-release
          # tag reuses its base version's section), so they never depend on the
          # previous tag the way --generate-notes does. Fall back to generated
          # notes only if the section is missing.
          base="${GITHUB_REF_NAME#v}"; base="${base%%-*}"
          awk -v h="## [$base]" 'index($0, h) == 1 {c=1; next} c && /^## \[/{exit} c' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft $prerelease "${notes[@]}" --title "SideScopes $GITHUB_REF_NAME"

  macos:
    needs: create-release
    runs-on: macos-latest
    # The secrets context is not allowed in step conditions; these flags
    # carry the presence checks somewhere it is.
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARIZATION_ID: ${{ secrets.APPLE_NOTARIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DSIDESCOPES_WERROR=ON -DSIDESCOPES_CODESIGN_IDENTITY=-

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Re-sign the bundle so the signature seals every resource
        # The CMake post-build sign can run before the app icon is placed in
        # the bundle, which leaves the seal invalid and makes Gatekeeper call a
        # downloaded build "damaged". Re-signing the finished bundle fixes it;
        # a Developer ID signature (below) overrides this ad-hoc one when set.
        run: codesign --force --deep --sign - build/SideScopes.app

      # With a Developer ID certificate in the secrets, the bundle is
      # signed with the hardened runtime, notarized, and stapled. Without
      # one, the ad-hoc build ships as-is and Gatekeeper asks users to
      # right-click and open; see docs/RELEASING.md.
      - name: Sign with Developer ID
        if: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" build/SideScopes.app
          rm certificate.p12

      - name: Notarize
        if: ${{ env.HAS_NOTARIZATION_ID == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent build/SideScopes.app notarize.zip
          xcrun notarytool submit notarize.zip --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM"
          xcrun stapler staple build/SideScopes.app

      - name: Verify the signature seals the whole bundle
        run: codesign --verify --deep --strict --verbose=2 build/SideScopes.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/SideScopes.app SideScopes-${GITHUB_REF_NAME}-macos.zip
          shasum -a 256 SideScopes-${GITHUB_REF_NAME}-macos.zip > \
            SideScopes-${GITHUB_REF_NAME}-macos.zip.sha256

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            SideScopes-${GITHUB_REF_NAME}-macos.zip \
            SideScopes-${GITHUB_REF_NAME}-macos.zip.sha256 --clobber

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        # Static CRT so the packaged .exe runs without a Visual C++
        # redistributable; it applies to the fetched dependencies too.
        run: cmake -B build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $zip = "SideScopes-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path build/Release/SideScopes.exe -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Upload Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "SideScopes-$env:GITHUB_REF_NAME-windows.zip"
          gh release upload "$env:GITHUB_REF_NAME" $zip "$zip.sha256" --clobber

  linux:
    needs: create-release
    # Built on the oldest supported LTS, not ubuntu-latest: the .deb/.rpm then
    # express their glibc floor as an older dependency and the AppImage runs on
    # that glibc and newer, so the packages install on mainstream distros rather
    # than only the very latest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build and packaging dependencies
        # rpm provides rpmbuild for the CPack RPM generator; file is what
        # dpkg-shlibdeps and appimagetool probe binaries with.
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev libpipewire-0.3-dev libgtk-3-dev rpm file

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build .deb, .rpm and a relocatable tarball
        # CPack builds the .deb and .rpm from the sidescopes component, versioned
        # by the tag, with their runtime dependencies discovered from the linked
        # libraries. The tarball is the same install tree for distros without a
        # package manager to hand: run bin/sidescopes directly.
        run: |
          version="${GITHUB_REF_NAME#v}"
          ( cd build && cpack -G "DEB;RPM" -D CPACK_PACKAGE_VERSION="$version" )
          dir="SideScopes-${GITHUB_REF_NAME}-linux-x86_64"
          cmake --install build --prefix "$PWD/stage/$dir" --component sidescopes
          tar -czf "$dir.tar.gz" -C stage "$dir"

      - name: Build the AppImage
        # A self-contained, chmod +x-and-run file. The AppDir is the install
        # tree plus the top-level .desktop, icon and AppRun that appimagetool
        # requires; the desktop's GTK/X11/PipeWire come from the host, which any
        # target desktop has.
        run: |
          cmake --install build --prefix AppDir/usr --component sidescopes
          cp AppDir/usr/share/applications/org.sidescopes.SideScopes.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/sidescopes.png AppDir/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/sidescopes" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir "SideScopes-${GITHUB_REF_NAME}-x86_64.AppImage"

      - name: Checksum and upload Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(build/*.deb build/*.rpm \
                  "SideScopes-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
                  "SideScopes-${GITHUB_REF_NAME}-x86_64.AppImage")
          for asset in "${assets[@]}"; do
            sha256sum "$asset" > "$asset.sha256"
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" "${assets[@]/%/.sha256}" --clobber

  # Flip the draft to published only after both platform jobs succeed. Because
  # this depends on both, GitHub's "Re-run failed jobs" re-runs it (a skipped
  # dependent) once a previously-failed platform is re-run and passes.
  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
