<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideScopes Lab</title>
<!-- The same mark the website wears, copied out of this repository's brand
     assets by the build. A lab page that arrived wearing the browser's blank
     document icon reads as somebody's scratch file, which is the opposite of
     what it is here to say. -->
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: dark }

  /* The page is exactly the viewport and never scrolls. It cannot be
     allowed to: the application takes the wheel for trace intensity, so a
     page that scrolled would ignore the wheel over the one part of it
     anybody points at, and the strip would hide below the fold with no
     obvious way back. Everything above the canvas is a fixed height and the
     canvas takes what is left. */
  html, body { height:100%; overflow:hidden }
  body { background:#141312; color:#f2eeec; font-family:system-ui; margin:0; padding:1rem;
         display:flex; flex-direction:column; gap:.75rem; box-sizing:border-box }

  /* min-height:0 is what lets a flex child actually shrink to the space
     left; without it the canvas keeps its content height and pushes the
     page into the overflow this layout exists to avoid. */
  #stage { flex:1 1 auto; min-height:0; border-radius:12px; overflow:hidden; background:#000 }
  #canvas { display:block; width:100%; height:100%; touch-action:none }
  /* The canvas is focusable so it receives keys; its focus ring is clipped
     by the stage's rounded corners and reads as a broken border, so it is
     taken off and the frame is left to the application's own drawing. */
  #canvas:focus, #canvas:focus-visible { outline:none }

  /* The filmstrip, in the shape a photographer already knows - and at the
     top, where it stays in view. */
  /* The padding is what the walk-through's ring stands in. overflow-x makes
     the vertical axis clip too, so without room here the ring is cut off top
     and bottom - and it has to be permanent, since padding that appeared only
     while the tour ran would shift the whole page under it. */
  .strip { flex:0 0 auto; display:flex; gap:.5rem; align-items:stretch; overflow-x:auto;
           padding:.4rem; scrollbar-width:thin }
  .strip button { all:unset; cursor:pointer; border-radius:6px; overflow:hidden;
                  border:1px solid #35312f; flex:0 0 auto; line-height:0;
                  transition:border-color .12s ease }
  .strip button:hover { border-color:#6f6a67 }
  .strip button[aria-current="true"] { border-color:#8ea2ff; box-shadow:0 0 0 1px #8ea2ff }
  .strip button:focus-visible { border-color:#8ea2ff }
  .strip img { display:block; width:92px; height:62px; object-fit:cover }
  .add { display:flex; align-items:center; justify-content:center; width:92px; height:62px;
         color:#8a827e; font-size:1.5rem; background:#1c1a19 }
  .strip button:hover .add { color:#8ea2ff }
  /* The walk-through's spotlight, for the two controls it names that live in
     the document rather than in the application. The overlay is drawn inside
     the canvas and cannot reach up here, so the page lights these itself while
     their stop is showing.
     Built to match what the overlay draws around an icon, since a visitor
     sees the two a moment apart: the page's own dark for the standoff, then
     the warm ring transient indicators wear here, then a soft edge outside it
     standing in for the veil. The element's own border is left ALONE, exactly
     as the overlay leaves the controls it points at. */
  .spotlight {
    box-shadow:0 0 0 3px #141312, 0 0 0 4.5px rgba(255,214,140,.95), 0 0 0 6px rgba(20,18,17,.6);
  }
  /* The adjustment panel already carries its own padding and corner, so the
     ring only has to agree with them. It must NOT restate either: a spotlight
     that changed the panel's box would resize it as the tour reached it, and
     everything below - the picture and the scopes - would jump. */
  .edit.spotlight { border-radius:8px }

  /* A FIXED height, and no wrapping. A credit line of a different length
     would otherwise reflow this row, change its height, and resize the
     canvas - so switching pictures would move the application window,
     which is the one thing that must never happen when only the picture
     changed. */
  /* A FIXED height, because the stage takes what is left and anything that
     reflows this row would resize the canvas - and with it the application
     window - the moment a longer credit line arrived. Tall enough for the
     button, which is what it was not: at 1.25rem the button was simply cut
     off by the overflow. */
  .note { flex:0 0 auto; display:flex; gap:1.25rem; align-items:center; margin:0;
          height:2rem; overflow:hidden; white-space:nowrap; color:#8a827e; font-size:.8125rem }
  /* The credit takes the left, under the filmstrip it belongs to, and gives
     way first when the row is narrow. */
  .note .credit { min-width:0; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis }
  /* The walk-through is the instructions now, so this only reopens it. It
     sits right, over the application it talks about, and never shrinks. */
  .note button {
    flex:0 0 auto; margin-left:auto; font:inherit; color:#cfc9c5; background:#221f1d;
    border:1px solid #3a3532; border-radius:6px; padding:5px 12px; cursor:pointer;
  }
  .note button:hover { background:#2b2725; color:#efe9e5 }

  /* The adjustments. These stand for the EDITOR a photographer has open
     beside SideScopes, so they are the page's and not the application's -
     drawn inside its window they would say that SideScopes edits photographs,
     which is the one thing this lab must not teach. Shaped like an editor's
     tool panel rather than like a form, because that is what they stand in
     for and because a photographer reads that shape without being told. */

  /* The work area: tools beside the workspace, which is the arrangement a
     photographer already works in and, more to the point, the only one that
     costs the picture NO HEIGHT. This page is exactly the viewport, so a row
     of controls above the canvas comes straight out of the picture and the
     scopes. A column spends the plentiful axis instead.

     The conventions below - the name to the left of its track, the reading to
     the right, the neutral point at the centre, tinted tracks where the
     control is a colour and ticks where it is a quantity - are the ones every
     raw editor has used for twenty years. They are here because a visitor's
     hand already knows them, not out of any association with a particular
     product. */
  .work { flex:1 1 auto; min-height:0; display:flex; gap:.75rem }
  .work #stage { flex:1 1 auto; min-width:0 }

  /* The width follows the window between two bounds, because the TRACK is
     what is left after a name and a reading - and a track is the control. At
     a fixed 14rem it was about a hundred pixels, or two points of a
     two-hundred-point range per pixel, which is not a control anybody can
     place a value with. */
  .edit { flex:0 0 clamp(14.5rem, 19%, 18rem); min-width:0; overflow-y:auto; overscroll-behavior:contain;
          padding:.55rem .65rem; margin:0; border:1px solid #2b2725; border-radius:8px;
          background:#191716 }

  /* Two groups, because seven controls split into a colour half and a tone
     half and nothing is gained by splitting them further. */
  .edit .group { margin:0 0 .7rem; padding:0 0 .7rem; border-bottom:1px solid #232120 }
  .edit .group:last-child { margin-bottom:0; padding-bottom:0; border-bottom:0 }
  /* Centred over the TRACKS, not over the panel: the rows spend their left on
     a name column and their right on a reading, so a heading centred in the
     panel sits visibly left of the sliders it titles. The insets are the two
     side columns and their gaps, so the heading stays centred as the panel
     width changes. */
  .edit .group > h2 { margin:.25rem 0 .4rem; font-size:.75rem; font-weight:400;
                      padding-left:calc(4.2rem + .45rem); padding-right:calc(2.2rem + .45rem);
                      text-align:center; color:#8a827e }

  /* Name, track, reading - the reading in a FIXED column so the tracks line
     up down the panel however many digits arrive. */
  .edit label { --track:#3a3532; touch-action:manipulation;
                display:grid; grid-template-columns:4.2rem 1fr 2.2rem; align-items:center;
                gap:.45rem; font-size:.75rem; color:#8a827e; padding:.22rem 0 }
  .edit label > span { text-align:right; overflow:hidden; text-overflow:ellipsis;
                       white-space:nowrap }
  .edit label:hover { color:#b0a9a5 }
  /* Tabular figures, so a value changing under a drag does not jiggle the
     column, and right-aligned so digits line up rather than signs. */
  .edit output { font-variant-numeric:tabular-nums; font-size:.6875rem; text-align:right;
                 color:#6f6a67 }
  /* A value that is no longer zero is the one thing worth colouring: it says
     which controls have been moved without reading seven numbers. */
  .edit label[data-moved="1"] { color:#cfc9c5 }
  .edit label[data-moved="1"] output { color:#8ea2ff }

  /* The track is drawn rather than left to the platform: the native control
     is a different height and weight on each OS, and this panel has to keep
     one rhythm down the column. */
  /* The HEIGHT here is the hit area, not the look: the track stays 4px and
     everything above it is room for the pointer to land. 13px was a mouse-only
     number. */
  .edit input[type=range] { --thumb-size:12px; -webkit-appearance:none; appearance:none;
                            width:100%; min-width:0;
                            height:22px; background:transparent; cursor:ew-resize; margin:0;
                            touch-action:none }
  .edit input[type=range]::-webkit-slider-runnable-track {
    height:4px; border-radius:2px; background:var(--track);
  }
  .edit input[type=range]::-moz-range-track { height:4px; border-radius:2px; background:var(--track) }
  .edit input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; width:var(--thumb-size); height:var(--thumb-size);
    margin-top:-4px;
    border-radius:50%; background:#d6d0cc; border:1px solid #0f0e0d;
  }
  .edit input[type=range]::-moz-range-thumb {
    width:var(--thumb-size); height:var(--thumb-size); border-radius:50%;
    background:#d6d0cc; border:1px solid #0f0e0d;
  }
  .edit label[data-moved="1"] input[type=range]::-webkit-slider-thumb { background:#8ea2ff }
  .edit label[data-moved="1"] input[type=range]::-moz-range-thumb { background:#8ea2ff }
  .edit input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 3px rgba(142,162,255,.35) }

  /* A colour control gets the axis it moves along, which says what it DOES
     before it is touched - the warm end, the green end. A quantity gets a
     plain track.
     It used to get evenly spaced ticks, and they were REMOVED rather than
     corrected: a range thumb's travel is inset by half its width at each end,
     so a tick at a percentage of the TRACK never lands on the value at that
     percentage of the RANGE. -1.00 of a four-stop exposure sat visibly off
     its mark. The inset can be computed, but it changes with the thumb and
     with every width this panel takes, and a gauge that is close but wrong is
     worse than no gauge - it invites reading a value off it. */
  .edit label[data-track="temp"] { --track:linear-gradient(90deg,#3f6fd8,#8a8f96 50%,#e8c04a) }
  .edit label[data-track="tint"] { --track:linear-gradient(90deg,#4bb45f,#8a8f96 50%,#c862c0) }
  .edit label[data-track="sat"]  { --track:linear-gradient(90deg,#6a6663,#8a8f96 50%,#d4574f) }

  /* The header: what these are, and the way back. Reset appears only when
     there is something to undo, the rule the application's own region tools
     follow. Its height is FIXED, because a header that grew to fit the button
     would shorten the canvas and move the application window under the hand
     dragging a slider. */
  .edit .edit-head { display:flex; align-items:center; gap:.6rem;
                     height:1.35rem; margin:0 0 .4rem; padding-bottom:.3rem;
                     border-bottom:1px solid #262322; font-size:.625rem; letter-spacing:.09em;
                     text-transform:uppercase; color:#5f5a57 }
  .edit .edit-head .spacer { flex:1 1 auto }
  .edit button {
    font:inherit; font-size:.6875rem; letter-spacing:0; text-transform:none;
    color:#8a827e; background:transparent; border:1px solid #3a3532; border-radius:5px;
    padding:1px 9px; cursor:pointer;
  }
  .edit button:hover { background:#221f1d; color:#efe9e5; border-color:#4a4441 }
  .edit button[hidden] { display:none }

  /* A FINGER is a different instrument from a pointer, and the difference is
     not the screen's width - a touch laptop is wide and still touched. So the
     targets grow on POINTER COARSE, which is the thing actually being asked
     about, and the layout changes on width separately. */
  @media (pointer: coarse) {
    .edit input[type=range] { --thumb-size:18px; height:34px }
    .edit input[type=range]::-webkit-slider-thumb { margin-top:-7px }
    .edit label { padding:.3rem 0 }
  }

  /* A PHONE, or a touch device held sideways. The document becomes one
     ordinary page instead of trying to compress every control into a single
     viewport. The stage is intentionally taller than it is wide: that gives
     the picture and the application enough room to stack, rather than
     shrinking them into an unusable side-by-side pair. The parent page learns
     this document's height below, so an embedded Lab still has one scrollbar,
     not a page scrolling inside another page.

     The adjustment panel keeps two groups side by side. Within each group a
     row folds, putting the track on its own line where it gets the whole
     column instead of the third left after a name and a number. */
  @media (max-width: 40rem), (max-height: 38rem) and (pointer: coarse) {
    html, body { height:auto; min-height:100%; overflow:visible }
    body { min-height:100vh }
    .work { flex:0 0 auto; flex-direction:column }
    .edit { flex:0 0 auto; max-height:none; overflow:visible;
            display:grid; grid-template-columns:1fr 1fr; column-gap:1rem; align-content:start }
    .edit .edit-head { grid-column:1/-1 }
    .edit .group { border-bottom:0; padding-bottom:0; margin-bottom:.4rem }
    /* The folded row has no side columns to allow for. */
    .edit .group > h2 { padding-left:0; padding-right:0 }
    .edit label { grid-template-columns:1fr auto; grid-template-areas:"name value" "track track";
                  gap:0 .5rem; padding:.15rem 0 .35rem }
    .edit label > span { grid-area:name; text-align:left }
    .edit output { grid-area:value }
    .edit input[type=range] { grid-area:track }
    #stage { flex:0 0 auto; height:clamp(32rem, 145vw, 44rem); min-height:32rem }
  }

  /* Shown only when this copy is opened from disk, where it cannot run. */
  .offline { max-width:36rem; margin:4rem auto; padding:0 1rem; line-height:1.5 }
  .offline h1 { font-size:1.25rem; margin:0 0 1rem }
  .offline p { color:#b0a9a5; margin:0 0 .75rem }
  .offline code { background:#221f1d; border-radius:4px; padding:.1rem .35rem; font-size:.9em }
</style>

<div class="strip" id="strip" aria-label="Sample and local images"></div>

<p class="note">
  <span class="credit" id="credit"></span>
  <button type="button" id="tour">Take the tour</button>
</p>

<!-- Seven controls, each one owning a scope: exposure and contrast move the
     waveform and the histogram, highlights and shadows move their two ends
     apart, temperature and tint carry the vectorscope's cloud off centre, and
     saturation moves it along the radius. -->
<div class="work">
<div class="edit" id="edit">
  <div class="edit-head">
    <span>Adjust</span>
    <span class="spacer"></span>
    <button type="button" id="a-reset" hidden>Reset</button>
  </div>
  <div class="group">
    <h2>Color</h2>
    <label data-adjust="temperature" data-track="temp">
      <span>Temp</span>
      <input type="range" id="a-temperature" min="-1" max="1" step="0.02" value="0"
        aria-label="Temp" aria-describedby="v-temperature">
      <output id="v-temperature" for="a-temperature">0</output>
    </label>
    <label data-adjust="tint" data-track="tint">
      <span>Tint</span>
      <input type="range" id="a-tint" min="-1" max="1" step="0.02" value="0"
        aria-label="Tint" aria-describedby="v-tint">
      <output id="v-tint" for="a-tint">0</output>
    </label>
    <label data-adjust="saturation" data-track="sat">
      <span>Saturation</span>
      <input type="range" id="a-saturation" min="-1" max="1" step="0.02" value="0"
        aria-label="Saturation" aria-describedby="v-saturation">
      <output id="v-saturation" for="a-saturation">0</output>
    </label>
  </div>
  <div class="group">
    <h2>Tone</h2>
    <label data-adjust="exposure">
      <span>Exposure</span>
      <input type="range" id="a-exposure" min="-2" max="2" step="0.05" value="0"
        aria-label="Exposure" aria-describedby="v-exposure">
      <output id="v-exposure" for="a-exposure">0.00</output>
    </label>
    <label data-adjust="contrast">
      <span>Contrast</span>
      <input type="range" id="a-contrast" min="-1" max="1" step="0.02" value="0"
        aria-label="Contrast" aria-describedby="v-contrast">
      <output id="v-contrast" for="a-contrast">0</output>
    </label>
    <label data-adjust="highlights">
      <span>Highlights</span>
      <input type="range" id="a-highlights" min="-1" max="1" step="0.02" value="0"
        aria-label="Highlights" aria-describedby="v-highlights">
      <output id="v-highlights" for="a-highlights">0</output>
    </label>
    <label data-adjust="shadows">
      <span>Shadows</span>
      <input type="range" id="a-shadows" min="-1" max="1" step="0.02" value="0"
        aria-label="Shadows" aria-describedby="v-shadows">
      <output id="v-shadows" for="a-shadows">0</output>
    </label>
  </div>
</div>

<div id="stage"><canvas id="canvas" tabindex="-1" aria-label="Interactive SideScopes scope panes"></canvas></div>
</div>

<input type="file" accept="image/*" id="file" hidden>

<script>
// An embedded Lab is a different origin from the website, so it cannot resize
// its frame directly. It can report its document height without exposing any
// image or interaction data; the parent validates the sender before using it.
// ResizeObserver also catches font, thumbnail and responsive-layout changes.
(function reportDocumentHeight() {
  if (window.parent === window || typeof ResizeObserver === 'undefined') { return; }
  var last = 0;
  function report() {
    var height = Math.ceil(document.documentElement.scrollHeight);
    if (height === last) { return; }
    last = height;
    window.parent.postMessage({ type: 'sidescopes-lab-height', height: height }, '*');
  }
  new ResizeObserver(report).observe(document.body);
  window.addEventListener('load', report);
  report();
}());
</script>

<!-- The engine, as a classic script defining a global factory. The build
     replaces this line with the script INLINED for the standalone file, which
     is what lets that one be opened straight from disk. -->
<script src="sidescopes-lab.js"></script>

<script type="module">

// The loader fetches its .wasm by a bare relative name, so busting only the
// module leaves a browser running a NEW loader against an OLD binary - which
// looks exactly like a change that did nothing. locateFile carries the
// build's digest onto the .wasm too; served from R2 the directory is already
// hashed and this is simply harmless.
// The application draws its own context menu, so the browser's must not
// appear over it. Suppressing it also fixes the menu opening only once:
// the native menu takes the pointer and the button-up never arrives, so
// the interface is left believing the right button is still down and
// ignores every press after the first.
//
// The canvas only. Everywhere else on the page the browser's menu is the
// right one and is left alone.
document.getElementById('canvas').addEventListener('contextmenu', (event) => event.preventDefault());

// Opened from disk, this copy cannot work and should say so rather than
// filling the console with CORS failures. A file:// page is its own opaque
// origin, so the engine may not fetch the .wasm sitting beside it - which is
// exactly why the standalone build exists, and this points at it. The check
// is here rather than nowhere because index.html is what anybody
// double-clicks, and a wall of red text is a poor way to learn that.
//
// The standalone file is built from this very page, so it would trip this
// guard and refuse to run - which is why it announces itself. Without that
// flag the one build meant to be opened from disk would be the one telling
// you to open it from somewhere else.
if (location.protocol === 'file:' && !window.__STANDALONE) {
  document.body.innerHTML =
    '<div class="offline">' +
    '<h1>This copy needs a web server</h1>' +
    '<p>A page opened straight from disk may not load the WebAssembly beside it: the browser treats ' +
    'every local file as its own origin and refuses the request.</p>' +
    '<p>To create a self-contained copy that opens from disk, run ' +
    '<code>scripts/build-web.sh --standalone</code> from the SideScopes repository, then open ' +
    '<code>build-web/sidescopes-lab.html</code>.</p>' +
    '<p>Or serve this directory over HTTP: <code>python3 -m http.server</code>.</p>' +
    '</div>';
  throw new Error('file:// - build the standalone copy or serve this directory');
}

const build = new URL(import.meta.url).searchParams.get('b') || '';
const mod = await SideScopesLab({
  canvas: document.getElementById('canvas'),
  locateFile: (path) => (build ? `${path}?b=${build}` : path),
});

// The walk-through's way back in. It lives in the APPLICATION rather than the
// page, so this only asks it to open: the stops, the bubbles and what counts
// as having settled it are all C++, and a desktop build could show the same
// tour without any of this file. Focus goes back to the canvas because the
// tour is drawn there and its buttons are its own, not the page's.
// The GLFW port mirrors the window's title into the document's, so the tab
// ends up saying "SideScopes" - the name drawn in the application's own title
// bar, which is right there and does not need repeating. Put back afterwards,
// because the tab is the page's to name.
document.title = 'SideScopes Lab';

// The adjustments reach the application as one call carrying all seven, so
// there is no state where some have arrived and others have not. The
// application applies them once per frame rather than once per event, so
// dragging costs one pass per redraw.
const ADJUSTMENTS = ['exposure', 'contrast', 'highlights', 'shadows', 'temperature', 'tint', 'saturation'];
const sliders = ADJUSTMENTS.map((name) => document.getElementById(`a-${name}`));
const readouts = ADJUSTMENTS.map((name) => document.getElementById(`v-${name}`));
const resetButton = document.getElementById('a-reset');

// A framed Lab can be taller than the phone viewport while the frame itself
// is expanded to avoid a second scrollbar. In that arrangement the website
// is the nearest scrollable page. WebKit and Chromium may claim a touch drag
// across the browsing-context boundary even though the interactive element
// says touch-action:none, cancelling the pointer stream before a slider or
// region gesture can finish. The first cancelable movement is the browser's
// remaining seam: suppress scrolling only on the two surfaces that interpret
// a drag, leaving the filmstrip, labels and empty ground available to scroll
// the website normally.
function retainInteractiveTouch(element) {
  element.addEventListener('touchmove', (event) => {
    if (event.cancelable) { event.preventDefault(); }
  }, { passive: false });
}

retainInteractiveTouch(document.getElementById('canvas'));

function setSliderFromTouch(slider, clientX) {
  const bounds = slider.getBoundingClientRect();
  const thumb = parseFloat(getComputedStyle(slider).getPropertyValue('--thumb-size')) || 0;
  const travel = Math.max(1, bounds.width - thumb);
  const share = Math.max(0, Math.min(1, (clientX - bounds.left - thumb / 2) / travel));
  const minimum = Number(slider.min);
  const maximum = Number(slider.max);
  const step = Number(slider.step) || 1;
  const steps = Math.round((share * (maximum - minimum)) / step);
  slider.value = String(minimum + steps * step);
  slider.dispatchEvent(new Event('input', { bubbles: true }));
}

sliders.forEach((slider) => {
  slider.addEventListener('touchmove', (event) => {
    if (event.touches.length !== 1) { return; }
    if (event.cancelable) { event.preventDefault(); }
    setSliderFromTouch(slider, event.touches[0].clientX);
  }, { passive: false });
});

// Exposure is read in STOPS and everything else on the hundred-point scale
// every editor a photographer already has open uses. Showing 0.55 for
// showing 0.55 where a photographer's own editor reads +55 would be a
// needless second vocabulary on a page whose whole job is to connect this
// instrument to the editor beside it.
function shownValue(name, value) {
  return name === 'exposure' ? value.toFixed(2) : String(Math.round(value * 100));
}

function refreshReadouts() {
  sliders.forEach((slider, at) => {
    const value = parseFloat(slider.value);
    const moved = value !== 0;
    readouts[at].textContent = (moved && value > 0 ? '+' : '') + shownValue(ADJUSTMENTS[at], value);
    slider.closest('label').dataset.moved = moved ? '1' : '0';
  });
  // Only when there is something to undo, the same rule the application's own
  // region-clearing controls follow.
  resetButton.hidden = sliders.every((slider) => parseFloat(slider.value) === 0);
}

function sendAdjustments() {
  mod.ccall('labSetAdjustments', null, ADJUSTMENTS.map(() => 'number'),
            sliders.map((slider) => parseFloat(slider.value)));
  refreshReadouts();
}

// Two taps return ONE control to neutral, which is what the editors these
// stand in for do, and the fastest way to ask "what was that one doing?"
// without losing the rest of the setting.
//
// Detected from POINTER events rather than taken from `dblclick`, because a
// finger on a range input never produces one: the touch handling consumes the
// pair. Pointer events are the same for both instruments, so the gesture is
// one implementation rather than a mouse path and a touch path that drift.
//
// 420ms sits between the two platform conventions this has to feel right
// against - a touch double-tap is judged at about 300ms and a desktop
// double-click at about 500 - and is still far short of two taps meant as
// two.
const DoubleTapMs = 420;
// Far enough to be a drag, and a drag is never a tap. Without this, finishing
// a slow drag near where a previous one ended reads as a double tap and
// throws the value away.
const TapSlopPx = 8;

sliders.forEach((slider) => {
  slider.addEventListener('input', sendAdjustments);

  const row = slider.closest('label');
  let lastTapAt = 0;
  let downX = 0;
  let downY = 0;

  row.addEventListener('pointerdown', (event) => {
    downX = event.clientX;
    downY = event.clientY;
  });
  row.addEventListener('pointerup', (event) => {
    if (Math.hypot(event.clientX - downX, event.clientY - downY) > TapSlopPx) {
      lastTapAt = 0;

      return;
    }
    if (event.timeStamp - lastTapAt <= DoubleTapMs) {
      slider.value = '0';
      sendAdjustments();
      lastTapAt = 0;

      return;
    }
    lastTapAt = event.timeStamp;
  });
});

resetButton.addEventListener('click', () => {
  sliders.forEach((slider) => { slider.value = '0'; });
  sendAdjustments();
  // Focus goes back for the same reason every strip interaction returns it:
  // the application stops hearing the keyboard the moment something else
  // holds focus, which reads as "the shortcuts stopped working".
  document.getElementById('canvas').focus();
});

refreshReadouts();

const tourButton = document.getElementById('tour');
tourButton.addEventListener('click', () => {
  mod.ccall('labStartTour', null, [], []);
  document.getElementById('canvas').focus();
});

// Public domain, works of the US federal government (17 U.S.C. 105). The
// portrait in the same set is deliberately absent: a face on a lab page
// invites the reading that the person endorses this, which a trace does not.
const SAMPLES = [
  ['skin-and-colour', 'Skin tones beside strong color', 'Library of Congress / Alfred T. Palmer, 1942'],
  ['neutral-detail', 'Near-neutral, fine detail', 'National Park Service'],
  ['wide-tonal-range', 'Deep shadow beside clipped highlight', 'NASA / Bill Ingalls'],
  ['flat-field', 'A mostly uniform field', 'National Park Service'],
];

const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });
const credit = document.getElementById('credit');
const strip = document.getElementById('strip');

function push(bitmap, limit = 1400) {
  const scale = Math.min(1, limit / Math.max(bitmap.width, bitmap.height));
  const width = Math.round(bitmap.width * scale);
  const height = Math.round(bitmap.height * scale);
  work.width = width; work.height = height;
  wctx.drawImage(bitmap, 0, 0, width, height);
  const image = wctx.getImageData(0, 0, width, height);
  const ptr = mod.ccall('labFrameBuffer', 'number', ['number', 'number'], [width, height]);
  if (!ptr) { return; }
  mod.HEAPU8.set(image.data, ptr);
  mod.ccall('labFrameReady', null, [], []);
}

// Any click in the strip takes focus off the canvas, and the application
// stops hearing the keyboard - which reads as "the shortcuts do not work"
// the moment anybody chooses a picture. Focus goes straight back.
function returnFocus() {
  document.getElementById('canvas').focus();
}

function markCurrent(button) {
  strip.querySelectorAll('button').forEach((b) => b.removeAttribute('aria-current'));
  if (button) { button.setAttribute('aria-current', 'true'); }
}

async function useSample(name, line, button) {
  // A data: URI in the standalone file, a sibling JPEG when served. fetch
  // reads a data: URI from a file:// page quite happily; it will not read a
  // sibling file, which is why the standalone one carries its pictures
  // inside it.
  const bitmap = await createImageBitmap(await (await fetch(sampleSource(name))).blob());
  push(bitmap);
  credit.textContent = line ? `Image: ${line}. Public domain.` : '';
  markCurrent(button);
  returnFocus();
}

// Where a photograph comes from: a data: URI in the standalone file, a
// sibling JPEG when served. ONE answer, because the thumbnail and the
// picture asked separately and the standalone build quietly kept fetching
// four siblings it could not have from disk.
//
// fetch reads a data: URI from a file:// page quite happily; it will not read
// a sibling file, which is why the standalone one carries its pictures.
function sampleSource(name) {
  return (window.__SAMPLES && window.__SAMPLES[name]) || `samples/${name}.jpg`;
}

const tiles = [];
for (const [name, title, line] of SAMPLES) {
  const button = document.createElement('button');
  button.title = title;
  const img = document.createElement('img');
  img.src = sampleSource(name);
  img.alt = title;
  img.addEventListener('error', () => button.remove());
  button.appendChild(img);
  button.addEventListener('click', () => useSample(name, line, button));
  strip.appendChild(button);
  tiles.push(button);
}

const addButton = document.createElement('button');
addButton.title = 'Load your own image';
addButton.setAttribute('aria-label', 'Load your own image');
addButton.innerHTML = '<span class="add">+</span>';
addButton.addEventListener('click', () => document.getElementById('file').click());
// The file dialog steals focus too; take it back when it closes either way.
window.addEventListener('focus', returnFocus);
strip.appendChild(addButton);

// The filmstrip and the adjustment controls belong to the document, not to
// the application, so the two sides have to meet in the middle for the two
// stops of the walk-through that name them: the page says where its control
// is, in points relative to the canvas, and the application says when it is
// talking about it. Their tops are NEGATIVE - both sit above the canvas -
// which is what puts the bubble at the top of the application, pointing the
// right way.
const canvasElement = document.getElementById('canvas');
const pageAnchors = [['strip', addButton], ['adjust', document.getElementById('edit')]];
function syncPageAnchors() {
  const canvas = canvasElement.getBoundingClientRect();
  for (const [id, element] of pageAnchors) {
    const box = element.getBoundingClientRect();
    mod.ccall('labSetPageAnchor', null, ['string', 'number', 'number', 'number', 'number'],
              [id, box.left - canvas.left, box.top - canvas.top,
               box.right - canvas.left, box.bottom - canvas.top]);
    element.classList.toggle('spotlight', mod.ccall('labTourAtAnchor', 'number', ['string'], [id]) === 1);
  }
  requestAnimationFrame(syncPageAnchors);
}
requestAnimationFrame(syncPageAnchors);

document.getElementById('file').addEventListener('change', async (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) { return; }
  const bitmap = await createImageBitmap(file);

  // Your photograph joins the strip, before the add tile, so it can be
  // returned to like any other. The thumbnail is drawn from the bitmap
  // already in memory; the file itself never leaves this page.
  const thumb = document.createElement('canvas');
  thumb.width = 208; thumb.height = 140;
  thumb.getContext('2d').drawImage(bitmap, 0, 0, 208, 140);
  const button = document.createElement('button');
  button.title = file.name;
  const img = document.createElement('img');
  img.src = thumb.toDataURL('image/jpeg', 0.8);
  img.alt = file.name;
  button.appendChild(img);
  const show = () => {
    push(bitmap);
    credit.textContent = 'Your image. Processed locally in this browser.';
    markCurrent(button);
    returnFocus();
  };
  button.addEventListener('click', show);
  strip.insertBefore(button, addButton);
  show();
  event.target.value = '';
});

// Something to look at immediately: a picture beneath a global region,
// rather than an empty scope and an instruction to draw one.
await useSample(SAMPLES[0][0], SAMPLES[0][2], tiles[0]);
// The embedding website records only this immutable build's successful ready
// state. It can then open the same build directly on a later visit instead of
// asking permission for a download the browser normally serves from cache.
if (window.parent !== window) {
  window.parent.postMessage({ type: 'sidescopes-lab-ready' }, '*');
}
</script>
